# Place this file in the floor-shift-manager repository root.
# docker compose --env-file .env.production -f compose.production.yaml ...
# Existing nginx-vps / platbase-nginx remains separately managed.
name: floor-shift-db

services:
  postgres:
    image: floor-shift-db-postgres
    build:
      context: ./postgres-docker
      dockerfile: Dockerfile
    container_name: floor-shift-db-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the existing database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the existing database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing database password}
      TZ: Asia/Tokyo
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - floor-shift
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: floor-shift-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override stale DB endpoints in backend/.env; db.py uses PG* for an empty URL.
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set the existing database name}
      PGUSER: ${POSTGRES_USER:?Set the existing database user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set the existing database password}
      SHIFT_SECURE_COOKIE: "true"
      SHIFT_ALLOWED_ORIGINS: ${SHIFT_ALLOWED_ORIGINS:-https://platbase-tooltech.xvps.jp}
      SHIFT_ALLOWED_HOSTS: ${SHIFT_ALLOWED_HOSTS:-platbase-tooltech.xvps.jp,backend,localhost,127.0.0.1}
      TZ: Asia/Tokyo
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    networks:
      - floor-shift
    logging: *logging

  frontend:
    image: floor-shift-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # Preserve existing -p 8080:80. Public HTTPS remains on platbase-nginx.
      - "${FRONTEND_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - floor-shift
    logging: *logging

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set the actual existing PostgreSQL volume name}

networks:
  floor-shift:
    name: floor-shift
    external: true
